    <style>
:root{--bg:#101013;--surface:#16161b;--line:#26262e;--line-2:#303039;--text:#e7e7ea;--muted:#9a9aa6;--faint:#6e6e7a;--accent:#8b5cf6;--accent-2:#a78bfa;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--warn:#ff6b7a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.aurora{display:none}
.container{text-align:center;padding:48px 40px;background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:90%;width:540px;transition:border-color .3s ease,box-shadow .3s ease}
.container.denied{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn),0 22px 55px -22px rgba(255,107,122,.45);animation:flashError .5s ease-in-out}
@keyframes flashError{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.icon-wrapper{width:72px;height:72px;border-radius:16px;background:var(--bg);border:1px solid var(--line-2);display:grid;place-items:center;margin:0 auto 24px;font-size:2rem}
.mono-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-bottom:18px;display:inline-block;background:rgba(139,92,246,.12);padding:5px 13px;border-radius:999px;border:1px solid rgba(139,92,246,.3)}
h1{font-size:2rem;font-weight:650;letter-spacing:-.02em;margin-bottom:14px;line-height:1.15;color:#fff}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;color:var(--accent-2);font-size:2.4rem;font-weight:400}
p{color:var(--muted);font-size:1.02rem;line-height:1.6;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border-radius:11px;font-size:.95rem;font-weight:600;text-decoration:none;color:#fff;background:var(--accent);border:none;cursor:pointer;transition:background .2s ease}.btn:hover{background:#7c4ef0}.btn:active{transform:translateY(1px)}
    </style>
</head>
<body>
    <div class="aurora"></div>
    <div class="container" id="card">
        <div class="icon-wrapper" id="icon">🔒</div>
        <div class="mono-tag" id="tag">SEC-ERR-049</div>
        <h1 id="title">Tried to use devtools? <br><span class="serif">Not on this website lol</span></h1>
        <p id="desc">KozzyX's proprietary source code is heavily guarded by quantum encryption hamsters. Looking under the hood is not allowed.</p>
        <a href="/" class="btn" aria-label="Return to Safety">Return to Safety</a>
    </div>

    <script>
        const card = document.getElementById('card');
        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const desc = document.getElementById('desc');
        const tag = document.getElementById('tag');

        function triggerWarning() {
            card.classList.add('denied');
            icon.innerText = "⚠️";
            tag.innerText = "ACCESS DENIED";
            tag.style.color = "var(--warn)";
            tag.style.borderColor = "color-mix(in oklab, var(--warn) 30%, transparent)";
            tag.style.background = "color-mix(in oklab, var(--warn) 15%, transparent)";
            title.innerHTML = "Action Intercepted.<br><span class='serif' style='color: var(--warn)'>Nice try.</span>";
            desc.innerText = "Further attempts to inspect elements or access developer tools will be logged and discarded.";

            setTimeout(() => {
                card.classList.remove('denied');
                icon.innerText = "🔒";
                tag.innerText = "SEC-ERR-049";
                tag.style.color = "var(--accent)";
                tag.style.borderColor = "color-mix(in oklab, var(--accent) 30%, transparent)";
                tag.style.background = "color-mix(in oklab, var(--accent) 15%, transparent)";
                title.innerHTML = "Tried to use devtools? <br><span class='serif'>Not on this website lol</span>";
                desc.innerText = "KozzyX's proprietary source code is heavily guarded by quantum encryption hamsters. Looking under the hood is not allowed.";
            }, 1200);
        }

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            triggerWarning();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                triggerWarning();
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c')) {
                e.preventDefault();
                triggerWarning();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'u') {
                e.preventDefault();
                triggerWarning();
            }
        });

        document.addEventListener('dragstart', (e) => e.preventDefault());
    </script>
</body>
</html>
