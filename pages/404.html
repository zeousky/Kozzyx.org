    --line: #d9d9d9;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  }

  h2 { font-size: 1.35rem; }

  p { margin: 0 0 1rem; }

  a { color: var(--link); }
  a:visited { color: var(--visited); }
  a:hover { text-decoration-thickness: 2px; }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem .85rem;
    padding: 0 0 1.25rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--line);
    font-size: .95rem;
  }

  ul, ol {
    padding-left: 1.25rem;
  }

  li { margin: .35rem 0; }

  .muted, footer {
    color: var(--muted);
    font-size: .9rem;
  }

  .note {
    border-left: 3px solid var(--line);
    padding-left: 1rem;
    color: #333;
  }

  .post {
    margin-bottom: 1.4rem;
  }

  .post h2, .post h3 {
    margin-bottom: .2rem;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .9em;
    background: #f3f3f3;
    padding: .08em .28em;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 2rem 0;
  }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    margin-top: 3rem;
  }

  @media (max-width: 520px) {
    main { margin-top: 28px; }
  }
