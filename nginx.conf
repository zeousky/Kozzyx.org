# kozzyx.org on Railway. TLS terminates at the edge; nginx serves HTTP on $PORT.
absolute_redirect off;
port_in_redirect off;

server {
    listen __PORT__ default_server;
    server_name kozzyx.org www.kozzyx.org;

    root /var/www/html;
    index index.html index_mobile.html;

    autoindex off;
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* \.(?:bak|old|orig|save|swp|swo|tmp|log|sql|sh|py|conf|cfg|ini|env|yml|yaml|lock|map|json|md|inc)$ {
        return 404; access_log off; log_not_found off;
    }
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location ^~ /api/ {
        resolver [fd12::10] valid=10s;
        set $kozzyx_bot kozzyx.railway.internal;
        proxy_pass http://$kozzyx_bot:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD|POST)$ ) { return 405; }
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2|webp)$ { expires 30d; access_log off; }
}